<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/app.css"><title>ParentControl Remote</title></head><body><main><header><div><small>ELTERNSTEUERUNG</small><h1>ParentControl Remote</h1></div><span id="online" class="pill">Verbinden…</span></header><section id="auth" class="card"><h2 id="authTitle">Elternanmeldung</h2><form id="authForm"><label>Benutzername<input id="user" autocomplete="username" required minlength="3"></label><label>Passwort<input id="password" type="password" autocomplete="current-password" required minlength="12"></label><button class="primary">Anmelden</button><p id="authError" class="error"></p></form></section><section id="dashboard" hidden><div class="grid"><article class="card info"><small>KINDER-PC</small><strong id="pc">–</strong><span id="contact">–</span></article><article class="card"><small>STATUS</small><strong id="state">–</strong><span id="reason">–</span></article></div><button id="lock" class="action danger">PC JETZT SPERREN<span>Warnung, danach Abmeldung</span></button><button id="unlock" class="action success">PC FREIGEBEN<span>Kinderkonto wieder aktivieren</span></button><div class="grid buttons"><button data-min="30">30 Min sperren</button><button data-min="60">60 Min sperren</button><button data-min="120">120 Min sperren</button><button id="sick">KRANKHEITSMODUS</button></div><button id="shutdown" class="action muted">PC HERUNTERFAHREN</button><p id="message"></p></section></main><script src="/app.js"></script></body></html>
